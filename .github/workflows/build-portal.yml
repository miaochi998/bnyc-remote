name: build-portal

# 手动触发（R16）：仅在需要发布新镜像时运行
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. latest, 0.1.0)"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./portal
          push: true
          tags: miaochi/bnyc-portal:${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
